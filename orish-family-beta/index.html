<style>
:root{--n:#07142c;--g:#e8bc55;--b:#1763d5;--ink:#10233e;--mut:#6f7f98;--line:#dce5f1;--bg:#edf3fb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{min-height:46px;cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#07142cee;color:#fff;backdrop-filter:blur(14px)}.brand{display:flex;gap:9px;align-items:center;font-weight:900}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe99b,#be8722);color:var(--n);font-weight:1000}.main{max-width:1080px;margin:auto;padding:18px 12px 60px}.hero{background:linear-gradient(145deg,#0b2d5a,#07142c 65%,#163f74);border-radius:28px;color:#fff;padding:24px;box-shadow:0 24px 60px #0b1b3830}.hero h1{font-size:clamp(42px,8vw,70px);line-height:.95;letter-spacing:-.05em;margin:8px 0 14px}.hero h1 span{color:var(--g)}.hero p{color:#d8e1ef;line-height:1.6}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff24;font-size:11px;font-weight:900}.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:900}.gold{background:linear-gradient(145deg,#f7dc80,#ce992a);color:var(--n)}.soft{background:#eaf2ff;color:#174d98}.ghost{background:#ffffff14;color:#fff;border:1px solid #ffffff22}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 14px 34px #132a4b12}.card h2{margin:0 0 6px;letter-spacing:-.03em}.sub{margin:0 0 14px;color:var(--mut);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.tile{border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(#fff,#f8fbff)}.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#e6efff,#fff0ba);font-size:24px;margin-bottom:10px}.tile h3{margin:0 0 5px}.tile p{font-size:13px;color:var(--mut);line-height:1.45}.notice{padding:12px 14px;border-radius:14px;background:#eef4ff;color:#315788;font-size:13px;line-height:1.5}.warn{background:#fff2cf;color:#775a18}.ok{background:#e8f8ef;color:#245f48}.modal{position:fixed;inset:0;background:#041023c5;z-index:30;display:grid;place-items:center;padding:14px}.modal>div{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}.field{margin:11px 0}.field label{display:block;font-weight:850;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:45px;border:1px solid #ccd8e7;border-radius:13px;padding:11px}.word{font-size:72px;font-weight:1000;text-align:center;letter-spacing:-.05em}.sentence{text-align:center;font-size:28px}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.choice{border:1px solid var(--line);border-radius:13px;background:#f7faff;padding:12px 16px;font-weight:900}.bar{height:10px;background:#e9eef5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2778dd,#ddb03b)}.footer{text-align:center;color:#74839a;font-size:12px;padding:20px}.hidden{display:none}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.hero{padding:20px}.hero h1{font-size:48px}}

.worldGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.world{border:0;border-radius:20px;min-height:160px;padding:15px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.world:before{content:"";position:absolute;width:105px;height:105px;border-radius:50%;right:-28px;top:-30px;background:#ffffff12}
.world span{position:absolute;top:14px;left:14px;font-size:32px}.world b{font-size:17px}.world small{opacity:.86;margin-top:4px;line-height:1.35}
.wRead{background:linear-gradient(145deg,#1764d4,#0b2d61)}.wMath{background:linear-gradient(145deg,#c88714,#e2ab36)}.wMake{background:linear-gradient(145deg,#734ed3,#32255f)}.wStory{background:linear-gradient(145deg,#d14a7a,#70264d)}.wDetect{background:linear-gradient(145deg,#293c56,#0e1c31)}.wSheet{background:linear-gradient(145deg,#1d8a79,#0b4e4e)}.wBuddy{background:linear-gradient(145deg,#157cad,#173665)}.wParent{background:linear-gradient(145deg,#71829e,#26374f)}
.brandHero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.character{position:relative;min-height:235px;border-radius:24px;background:linear-gradient(145deg,#0b2e60,#07142c);overflow:hidden;color:#fff;padding:18px}.character h2{font-size:30px;margin:6px 0}.character p{max-width:60%;color:#d9e3ef}.orb{position:absolute;right:35px;bottom:12px;width:118px;height:154px;border-radius:60px 60px 24px 24px;background:linear-gradient(#1f6ed9 0 72%,#112747 72%);box-shadow:0 16px 36px #0005}.orb:before{content:"";position:absolute;width:88px;height:88px;border-radius:50%;background:#8f563d;left:15px;top:-54px;border:4px solid #e8bc55}.orb:after{content:"✦";position:absolute;right:-18px;top:-65px;color:#39d7e7;font-size:32px;text-shadow:-80px 50px #39d7e7}.xp{height:10px;border-radius:999px;background:#e7edf5;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#1d6ee8,#39d7e7,#e8bc55)}
.missionBox{border:2px solid #e8bc55;background:#fffdf5;border-radius:18px;padding:15px;margin-top:12px}.worksheet{border:2px solid #0c2d5d;border-radius:18px;padding:18px;margin-top:12px}.worksheet .line{height:26px;border-bottom:1px solid #8fa1ba}.sheetActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chat{display:grid;gap:8px;margin:12px 0}.bubble{max-width:86%;padding:10px 12px;border-radius:15px}.bot{background:#eef4ff;color:#244c7e}.usr{background:#102e58;color:#fff;margin-left:auto}.chatInput{display:flex;gap:8px}.chatInput input{flex:1;min-height:46px;border:1px solid #ccd8e7;border-radius:13px;padding:10px}
@media(max-width:760px){.worldGrid{grid-template-columns:repeat(2,1fr)}.brandHero{grid-template-columns:1fr}}@media(max-width:430px){.worldGrid{grid-template-columns:1fr 1fr}.world{min-height:150px}.character p{max-width:58%}.orb{right:12px;transform:scale(.85);transform-origin:bottom right}}
@media print{.top,.hero,.brandHero,.worldGrid,.footer,.noPrint,.modal>div>button{display:none!important}.modal{position:static;background:#fff;padding:0}.modal>div{max-height:none;width:100%;padding:0}.worksheet{border:2px solid #000}}

<body>
<header class="top"><div class="brand"><div class="logo">OW</div><div>Orish's World<br><small>@ THE CODE</small></div></div><span class="pill">Family Beta</span></header>
<div id="app"></div>
<script>
const API='https://ivlaydusephjplgktyge.supabase.co/functions/v1/family-beta-api';
const S={token:sessionStorage.getItem('owb_token'),age:sessionStorage.getItem('owb_age'),done:new Set(JSON.parse(sessionStorage.getItem('owb_done')||'[]')),ratings:{ease:0,engage:0,off:0}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
async function api(payload){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});return await r.json()}catch{return {ok:false}}}
function tile(i,t,p,a){return `<div class="tile"><div class="ico">${i}</div><h3>${t}</h3><p>${p}</p><button class="btn soft" data-a="${a}">Open</button></div>`}
function landing(){return '<main class="main templateLanding"><section class="templateFrame" aria-label="Orish\'s World home"><img src="orish-template.webp" alt="Orish\'s World Junior Detective learning world"><button class="templateHot templateEnter" data-a="start" aria-label="Enter Orish\'s World">Enter Orish\'s World</button><button class="templateHot templateRead" data-a="start" aria-label="Reading Rocket Bay">Reading Rocket Bay</button><button class="templateHot templateMath" data-a="start" aria-label="Maths Galaxy">Maths Galaxy</button><button class="templateHot templateStory" data-a="start" aria-label="Story Cinema">Story Cinema</button><button class="templateHot templateMake" data-a="start" aria-label="Make Lab">Make Lab</button></section></main>'}
function world(icon,name,desc,cls,a){return '<button class="world '+cls+'" data-a="'+a+'"><span>'+icon+'</span><b>'+name+'</b><small>'+desc+'</small></button>'}
function guide(){if(S.age==='4-6'||S.age==='7-10')return['Orish','🧒🏾','We learn together, then you teach me back.'];if(S.age==='11-13')return['Antwarn','🕵🏾','You are the investigator. Find the evidence and explain your reasoning.'];return['Dafari','🧭','Lead the case. Question weak evidence and prove what you know.']}
function home(){const g=guide(),pct=Math.min(100,S.done.size*25);return '<main class="main"><section class="brandHero"><div class="character"><span class="pill">'+g[1]+'</span><h2>'+g[0]+' is waiting.</h2><p>'+g[2]+'</p><div class="orb"></div></div><div class="card" style="margin-top:0"><h2>Your adventure</h2><div class="xp"><i style="width:'+pct+'%"></i></div><p><b>'+S.done.size+'/4 core missions tried</b></p><div class="notice">Earn progress by completing a reading, maths, make or worksheet mission.</div><button class="btn gold" style="margin-top:10px" data-a="random">Surprise mission</button></div></section><section class="card"><h2>Choose a world</h2><div class="worldGrid">'+world('🚀','Reading Rocket Bay',S.age==='4-6'?'Launch words into sentences.':S.age==='7-10'?'Read clues and predict.':'Evidence-reading case files.','wRead','reading')+world('🪐','Maths Galaxy',S.age==='4-6'?'Build number worlds.':S.age==='7-10'?'Fractions and measure.':'Ratio and reasoning.','wMath','maths')+world('🧪','Make Lab','Get off-screen and use the world around you.','wMake','move')+world('🎬','Story Cinema','Choose what happens next.','wStory','story')+world('🕵🏾','Detective HQ','Clues, evidence and explanation.','wDetect','detective')+world('📝','Mission Sheet Studio','Generate a fresh worksheet and print it.','wSheet','worksheets')+world('💬','Orish Learning Buddy','Type what you are stuck on and get a clue.','wBuddy','buddy')+world('👨‍👩‍👧','Grown-Up View','See progress and give feedback.','wParent','parent')+'</div></section></main>'}
function modal(h){document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div><button class="btn soft" style="float:right" data-a="close">Close</button>${h}</div></div>`);bind()}
function gate(){modal(`<h2>Before you start</h2><div class="notice">Please do not type a child’s name, school, address or other personal information.</div><form id="gate"><div class="field"><label>Family beta code</label><input name="code" autocapitalize="characters" required></div><div class="field"><label>Child age band</label><select name="age" required><option value="">Choose…</option><option>4-6</option><option>7-10</option><option>11-13</option><option>14-16</option></select></div><label style="display:flex;gap:8px"><input type="checkbox" required> <span>I am the supervising adult and understand this is a tester version, not a school assessment.</span></label><button class="btn gold" style="width:100%;margin-top:12px">Enter beta</button></form><div id="gmsg" class="notice hidden" style="margin-top:10px"></div>`)}
function complete(k){S.done.add(k);sessionStorage.setItem('owb_done',JSON.stringify([...S.done]));api({action:'event',token:S.token,event_key:'complete_'+k,event_value:S.age})}
function reading(){api({action:'event',token:S.token,event_key:'open_reading',event_value:S.age});if(S.age==='4-6')return modal(`<h2>Read it first</h2><div class="word">sat</div><div class="sentence">Pat sat.</div><div class="notice">Text first. No picture clue yet.</div><h3>Prove it</h3><p>Ask the child to read: <b>Sam sat.</b></p><button class="btn gold" data-done="reading">We tried it</button>`);if(S.age==='7-10')return modal(`<h2>Mini reading mission</h2><div class="notice">Mia put an ice cube on two plates. One plate was in the sun and one was in the shade. She checked them five minutes later.</div><h3>Which will melt faster, and what clue helped you decide?</h3><p><b>Fresh proof:</b> warm window vs cool cupboard — what do you predict?</p><button class="btn gold" data-done="reading">We discussed it</button>`);return modal(`<h2>${S.age==='11-13'?'Antwarn Case File':'Dafari Evidence Studio'}</h2><p><b>A.</b> Everyone online says it.</p><p><b>B.</b> A current source gives a date, evidence and method.</p><p><b>C.</b> One person remembers hearing it.</p><div class="choices"><button class="choice ans">A</button><button class="choice ans" data-ok="1">B</button><button class="choice ans">C</button></div><div id="msg" class="notice">Choose the strongest claim, then explain why.</div><button class="btn gold" data-done="reading">We discussed it</button>`)}
function maths(){api({action:'event',token:S.token,event_key:'open_maths',event_value:S.age});if(S.age==='4-6')return modal(`<h2>Build 10 two ways</h2><p>Use buttons, pasta, blocks or other safe objects. Make 10 in two different ways and explain why both are still 10.</p><button class="btn gold" data-done="maths">We made it</button>`);if(S.age==='7-10')return modal(`<h2>Fraction mission</h2><p>Fold paper into 4 equal parts and shade 1.</p><div class="choices"><button class="choice ans">1/2</button><button class="choice ans" data-ok="1">1/4</button><button class="choice ans">3/4</button></div><div id="msg" class="notice">Then try 2/8. Is it the same amount?</div><button class="btn gold" data-done="maths">We tried it</button>`);return modal(`<h2>Ratio case</h2><p>A drink uses 2 cups water for every 1 cup juice. Make 3 times as much.</p><div class="choices"><button class="choice ans">4 / 2</button><button class="choice ans" data-ok="1">6 / 3</button><button class="choice ans">6 / 2</button></div><div id="msg" class="notice">Explain the scaling, not just the answer.</div><button class="btn gold" data-done="maths">We explained it</button>`)}
function move(){api({action:'event',token:S.token,event_key:'open_move',event_value:S.age});const t=S.age==='4-6'?'Find 3 safe objects. Put them shortest to tallest and explain how you decided.':S.age==='7-10'?'Find 3 safe objects. Estimate their length, then measure and compare.':S.age==='11-13'?'Choose one room. Identify 3 design choices that help or hinder its use, then propose one improvement.':'Find one non-personal claim on packaging or an advert. List what evidence would verify it.';modal(`<h2>Leave the screen for 3 minutes</h2><p>${t}</p><button class="btn gold" data-done="move">We came back & explained</button>`)}
function online(){api({action:'event',token:S.token,event_key:'open_online',event_value:S.age});const q=S.age==='4-6'?['Find <b>sat</b>','sit','sat','mat']:S.age==='7-10'?['Which equals one half?','1/3','2/4','3/4']:['Which is stronger evidence?','No source','Current evidence-backed source','Popular opinion'];modal(`<h2>Do Online</h2><p>${q[0]}</p><div class="choices"><button class="choice ans">${q[1]}</button><button class="choice ans" data-ok="1">${q[2]}</button><button class="choice ans">${q[3]}</button></div><div id="msg" class="notice">Online still ends with an off-screen proof.</div><button class="btn gold" data-done="online">Finish task</button>`)}
function ai(){modal(`<h2>AI Buddy Preview</h2><div class="notice warn"><b>Live AI is off in this beta.</b> Production AI pauses when inactive, and verified phonics sounds come from a reviewed sound bank.</div><p><b>${guide()[0]}:</b> “Show me what you can do first. If you get stuck, I’ll help. Then go away from the screen and prove it.”</p>`)}
function worlds(){modal(`<h2>Learning Worlds Preview</h2><div class="grid">${['💷 Financial Literacy','🧰 Life Skills','💡 Entrepreneurship','🤖 Coding & AI','🍳 Cooking & Nutrition','⚖️ UK Law & Rights','🗣️ Heritage Languages','🌍 World Languages & Cultures'].map(x=>`<div class="tile"><h3>${x}</h3></div>`).join('')}</div>`)}

function story(){modal('<span class="tag">🎬 STORY CINEMA</span><h2>The Too-Fast Rocket</h2><p>Orish builds a cardboard rocket, but one side keeps collapsing.</p><h3>What should he do?</h3><div class="choices"><button class="choice storyAns" data-v="rush">Tape it quickly and launch</button><button class="choice storyAns" data-v="test">Stop, test the weak side and strengthen it</button><button class="choice storyAns" data-v="quit">Give up</button></div><div id="storyMsg" class="notice">Choose a path.</div><div class="missionBox"><b>Make it real:</b> build a tiny paper structure and change one thing to make it stronger.</div><button class="btn gold" data-done="story" style="margin-top:10px">Story mission complete</button>')}
function detective(){if(S.age==='4-6'||S.age==='7-10')return modal('<span class="tag">🕵🏾 JUNIOR DETECTIVE</span><h2>Where is Orish\'s blue notebook?</h2><p>Clue 1: last used near the sofa.<br>Clue 2: a pencil is under the table.<br>Clue 3: the backpack is closed.</p><h3>Where would you investigate first, and why?</h3><button class="btn gold" data-done="detective">I explained my clue</button>');return reading()}
function worksheetData(topic){const y=S.age==='4-6',m=S.age==='7-10';if(topic==='reading')return y?['Rocket Word Mission','Circle: sat / sit / mat / sat','Build SAT with letter cards.','Read: Sam sat.','Teach Orish how you knew.']:m?['Reading Evidence Mission','Read a paragraph from a book at home.','Write one fact and one prediction.','Find a sentence supporting the prediction.','Explain it aloud.']:['Source Detective Sheet','Write a non-personal claim you saw today.','Name the source.','What evidence is given?','What would make it stronger?'];return y?['Planet 10 Mission','Draw 10 stars.','Split them into 2 groups.','Write ___ + ___ = 10.','Make 10 a different way.']:m?['Measure Mission','Estimate 3 safe objects.','Measure them.','Record the difference.','Show 1/4 and 2/8 with folded paper.']:['Maths Case Sheet','Solve a 2:1 ratio scaled three times.','Draw a model.','Explain the scale factor.','Create an equivalent ratio.']}
function worksheets(){modal('<span class="tag">📝 MISSION SHEET STUDIO</span><h2>Make a fresh worksheet</h2><p>Choose a topic. Print it or use paper without a printer.</p><div class="choices"><button class="choice genSheet" data-topic="reading">Reading</button><button class="choice genSheet" data-topic="maths">Maths</button></div><div id="sheetHolder"></div>')}
function showSheet(topic){const a=worksheetData(topic);$('#sheetHolder').innerHTML='<div class="worksheet"><h2>Orish\'s World • '+a[0]+'</h2><p><b>Age '+S.age+'</b></p>'+a.slice(1).map(x=>'<p>'+x+'</p><div class="line"></div>').join('')+'<p><b>Prove It:</b> explain one answer without looking back.</p></div><div class="sheetActions noPrint"><button class="btn gold" data-a="printSheet">Print / Save PDF</button><button class="btn soft" data-done="worksheet">Mark tried</button></div>';bind()}
function buddyReply(q){q=q.toLowerCase();if(q.includes('answer'))return 'I will not give the answer first. Tell me what you already notice and I will give you one clue.';if(q.includes('help')||q.includes('stuck'))return 'Say the question in your own words. What is the first thing you know for sure?';if(/math|fraction|ratio|number/.test(q))return 'Show it with objects, groups or a drawing first. What does each part mean?';if(/read|word|story/.test(q))return 'Read around the tricky part. What clue comes from the words rather than the picture?';return 'Tell me what you tried already. I will help with the next step, not take over the thinking.'}
function buddy(){S.chat=[['bot','Hi! I\'m Orish. Tell me what you are working on or where you got stuck.']];modal('<span class="tag">💬 ORISH LEARNING BUDDY</span><h2>Talk it through</h2><div class="notice warn"><b>Beta:</b> this is a guided local helper. Paid live generative AI is not switched on yet.</div><div class="chat" id="chat"></div><div class="chatInput"><input id="chatText" placeholder="I am stuck on..."><button class="btn gold" data-a="sendChat">Send</button></div>');drawChat()}
function drawChat(){const c=$('#chat');if(c)c.innerHTML=S.chat.map(([r,t])=>'<div class="bubble '+(r==='bot'?'bot':'usr')+'">'+t+'</div>').join('')}

function parent(){modal(`<h2>Parent View Preview</h2><div class="notice ok"><b>Independent:</b> completed a new example without help.</div><div class="notice" style="margin-top:8px"><b>Helped:</b> completed after a prompt.</div><div class="notice warn" style="margin-top:8px"><b>Mic unclear:</b> never counted as a child error.</div>`)}
function stars(k){return[1,2,3,4,5].map(n=>`<button type="button" data-rate="${k}" data-n="${n}" class="${S.ratings[k]===n?'on':''}">${n}</button>`).join('')}
function feedback(){modal(`<h2>Adult tester feedback</h2><p class="sub">Do not include child names or schools.</p><form id="fb"><div class="field"><label>Easy to use? 1–5</label><div class="rating">${stars('ease')}</div></div><div class="field"><label>Child engaged? 1–5</label><div class="rating">${stars('engage')}</div></div><div class="field"><label>Off-screen learning idea? 1–5</label><div class="rating">${stars('off')}</div></div><div class="field"><label>How much help?</label><select name="help"><option value="no">None</option><option value="a_little">A little</option><option value="a_lot">A lot</option><option value="not_sure">Not sure</option></select></div><div class="field"><label>Favourite area</label><select name="fav"><option>Reading</option><option>Maths</option><option>Move & Make</option><option>Do Online</option><option>AI approach</option></select></div><div class="field"><label>Comment (optional)</label><textarea name="comment" rows="4"></textarea></div><button class="btn gold" style="width:100%">Send anonymous feedback</button></form><div id="fmsg"></div>`)}
function render(){document.body.classList.toggle('landingMode',!S.token);$('#app').innerHTML=S.token?home():landing();bind()}
function bind(){$$('[data-a="start"]').forEach(b=>b.onclick=gate);$$('[data-a="preview"]').forEach(b=>b.onclick=()=>alert('Tap Start family test first.'));$$('[data-a="close"]').forEach(b=>b.onclick=()=>b.closest('.modal')?.remove());$$('[data-a="exit"]').forEach(b=>b.onclick=()=>{sessionStorage.clear();location.reload()});const map={reading,maths,move,online,ai,worlds,story,detective,worksheets,buddy,parent,feedback};Object.entries(map).forEach(([k,v])=>$('[data-a="'+k+'"]').forEach(b=>b.onclick=v));$('[data-a="random"]').forEach(b=>b.onclick=()=>[reading,maths,move,story][Math.floor(Math.random()*4)]());$('.storyAns').forEach(b=>b.onclick=()=>{$('#storyMsg').innerHTML=b.dataset.v==='test'?'<b>Strong choice.</b> Orish tests the weak side and improves the rocket.':'What could happen next? Think about testing, safety and learning from mistakes.'});$('.genSheet').forEach(b=>b.onclick=()=>showSheet(b.dataset.topic));$('[data-a="printSheet"]').forEach(b=>b.onclick=()=>window.print());$('[data-a="sendChat"]').forEach(b=>b.onclick=()=>{const i=$('#chatText'),q=i.value.trim();if(!q)return;S.chat.push(['usr',q],['bot',buddyReply(q)]);i.value='';drawChat()});$$('.ans').forEach(b=>b.onclick=()=>{const m=$('#msg');if(m)m.innerHTML=b.dataset.ok?'<b>Good.</b> Now explain how you know.':'Try again and explain the relationship or evidence.'});$$('[data-done]').forEach(b=>b.onclick=()=>{complete(b.dataset.done);b.closest('.modal')?.remove();render()});$$('[data-rate]').forEach(b=>b.onclick=()=>{S.ratings[b.dataset.rate]=Number(b.dataset.n);b.parentElement.innerHTML=stars(b.dataset.rate);bind()});const g=$('#gate');if(g)g.onsubmit=async e=>{e.preventDefault();const f=new FormData(g),m=$('#gmsg');m.classList.remove('hidden');m.textContent='Checking beta access…';const x=await api({action:'start',code:String(f.get('code')).trim().toUpperCase(),age_band:f.get('age')});if(!x.ok){m.className='notice warn';m.textContent='Beta access was not accepted. Check the code and try again.';return}S.token=x.beta_token;S.age=f.get('age');sessionStorage.setItem('owb_token',S.token);sessionStorage.setItem('owb_age',S.age);document.querySelector('.modal')?.remove();render()};const fb=$('#fb');if(fb)fb.onsubmit=async e=>{e.preventDefault();const f=new FormData(fb),m=$('#fmsg');if(!S.ratings.ease||!S.ratings.engage||!S.ratings.off){m.innerHTML='<div class="notice warn">Please give all three ratings.</div>';return}const x=await api({action:'feedback',token:S.token,ease_rating:S.ratings.ease,engagement_rating:S.ratings.engage,offscreen_rating:S.ratings.off,child_needed_help:f.get('help'),favourite_area:f.get('fav'),adult_comment:f.get('comment')});m.innerHTML=x.ok?'<div class="notice ok"><b>Thank you.</b> Anonymous feedback sent.</div>':'<div class="notice warn">Could not send feedback. Please try again.</div>'}}
render();
</script>
<div class="footer">Orish's World @ THE CODE • Closed Friends & Family Beta</div>
</body>
</html>
