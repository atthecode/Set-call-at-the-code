<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07142c" />
<title>Orish's World — Friends & Family Beta</title>
<style>
:root{--n:#07142c;--g:#e8bc55;--b:#1763d5;--ink:#10233e;--mut:#6f7f98;--line:#dce5f1;--bg:#edf3fb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{min-height:46px;cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#07142cee;color:#fff;backdrop-filter:blur(14px)}.brand{display:flex;gap:9px;align-items:center;font-weight:900}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe99b,#be8722);color:var(--n);font-weight:1000}.main{max-width:1080px;margin:auto;padding:18px 12px 60px}.hero{background:linear-gradient(145deg,#0b2d5a,#07142c 65%,#163f74);border-radius:28px;color:#fff;padding:24px;box-shadow:0 24px 60px #0b1b3830}.hero h1{font-size:clamp(42px,8vw,70px);line-height:.95;letter-spacing:-.05em;margin:8px 0 14px}.hero h1 span{color:var(--g)}.hero p{color:#d8e1ef;line-height:1.6}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff24;font-size:11px;font-weight:900}.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:900}.gold{background:linear-gradient(145deg,#f7dc80,#ce992a);color:var(--n)}.soft{background:#eaf2ff;color:#174d98}.ghost{background:#ffffff14;color:#fff;border:1px solid #ffffff22}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 14px 34px #132a4b12}.card h2{margin:0 0 6px;letter-spacing:-.03em}.sub{margin:0 0 14px;color:var(--mut);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.tile{border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(#fff,#f8fbff)}.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#e6efff,#fff0ba);font-size:24px;margin-bottom:10px}.tile h3{margin:0 0 5px}.tile p{font-size:13px;color:var(--mut);line-height:1.45}.notice{padding:12px 14px;border-radius:14px;background:#eef4ff;color:#315788;font-size:13px;line-height:1.5}.warn{background:#fff2cf;color:#775a18}.ok{background:#e8f8ef;color:#245f48}.modal{position:fixed;inset:0;background:#041023c5;z-index:30;display:grid;place-items:center;padding:14px}.modal>div{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}.field{margin:11px 0}.field label{display:block;font-weight:850;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:45px;border:1px solid #ccd8e7;border-radius:13px;padding:11px}.word{font-size:72px;font-weight:1000;text-align:center;letter-spacing:-.05em}.sentence{text-align:center;font-size:28px}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.choice{border:1px solid var(--line);border-radius:13px;background:#f7faff;padding:12px 16px;font-weight:900}.bar{height:10px;background:#e9eef5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2778dd,#ddb03b)}.footer{text-align:center;color:#74839a;font-size:12px;padding:20px}.hidden{display:none}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.hero{padding:20px}.hero h1{font-size:48px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">OW</div><div>Orish's World<br><small>@ THE CODE</small></div></div><span class="pill">Family Beta</span></header>
<div id="app"></div>
<script>
const API='https://ivlaydusephjplgktyge.supabase.co/functions/v1/family-beta-api';
const S={token:sessionStorage.getItem('owb_token'),age:sessionStorage.getItem('owb_age'),done:new Set(JSON.parse(sessionStorage.getItem('owb_done')||'[]')),ratings:{ease:0,engage:0,off:0}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
async function api(payload){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});return await r.json()}catch{return {ok:false}}}
function tile(i,t,p,a){return `<div class="tile"><div class="ico">${i}</div><h3>${t}</h3><p>${p}</p><button class="btn soft" data-a="${a}">Open</button></div>`}
function landing(){return `<main class="main"><section class="hero"><span class="pill">CLOSED FRIENDS & FAMILY TEST</span><h1>Help us test learning that <span>comes alive.</span></h1><p>Children can try reading, maths, online activities and real-world learning while an adult supervises. No child name, email, school or raw audio is collected in this tester version.</p><button class="btn gold" data-a="start">Start family test</button></section><section class="card"><h2>What to test</h2><div class="grid">${tile('🔤','Reading','Try an age-appropriate reading task and a fresh proof example.','preview')}${tile('➗','Maths','Try practical maths and explain the method.','preview')}${tile('✂️','Move & Make','See how the app takes the child away from the screen.','preview')}${tile('💬','Feedback','Send anonymous adult tester feedback.','preview')}</div></section><section class="card"><div class="notice warn"><b>Tester limits:</b> live AI voice, law lessons and reviewed language pronunciation remain switched off in this beta.</div></section></main>`}
function guide(){if(S.age==='4-6'||S.age==='7-10')return['Orish','🧒🏾','We learn together, then you teach me back.'];if(S.age==='11-13')return['Antwarn','🕵🏾','You are the investigator. Find the evidence and explain your reasoning.'];return['Dafari','🧭','Lead the case. Question weak evidence and prove what you know.']}
function home(){const g=guide(),pct=Math.min(100,S.done.size/4*100);return `<main class="main"><section class="hero"><span class="pill">AGE ${S.age}</span><h1>${g[0]} is <span>ready.</span></h1><p>${g[1]} ${g[2]}</p><div class="bar"><i style="width:${pct}%"></i></div><p><b>${S.done.size}/4 core tester areas tried</b></p><button class="btn gold" data-a="feedback">Finish & give feedback</button> <button class="btn ghost" data-a="exit">Exit beta</button></section><section class="card"><h2>Choose a learning area</h2><div class="grid">${tile('🔤','Reading',S.age==='4-6'?'Decodable text then a fresh sentence.':S.age==='7-10'?'Comprehension and transfer.':'Evidence-reading case file.','reading')}${tile('➗','Maths',S.age==='4-6'?'Build number 10 with real objects.':S.age==='7-10'?'Fraction and measure mission.':'Ratio and reasoning case.','maths')}${tile('✂️','Move & Make','Leave the device and complete a real-world mission.','move')}${tile('💻','Do Online','No printer needed, but still ends with off-screen proof.','online')}${tile('🤖','AI Buddy Preview','See how AI hands learning back to the child.','ai')}${tile('🌍','Learning Worlds','Preview the wider learning universe.','worlds')}${tile('🗂️','Parent View','Preview independent/helped/mic-unclear evidence.','parent')}${tile('✅','Finish Test','Send anonymous adult tester feedback.','feedback')}</div></section></main>`}
function modal(h){document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div><button class="btn soft" style="float:right" data-a="close">Close</button>${h}</div></div>`);bind()}
function gate(){modal(`<h2>Before you start</h2><div class="notice">Please do not type a child’s name, school, address or other personal information.</div><form id="gate"><div class="field"><label>Family beta code</label><input name="code" autocapitalize="characters" required></div><div class="field"><label>Child age band</label><select name="age" required><option value="">Choose…</option><option>4-6</option><option>7-10</option><option>11-13</option><option>14-16</option></select></div><label style="display:flex;gap:8px"><input type="checkbox" required> <span>I am the supervising adult and understand this is a tester version, not a school assessment.</span></label><button class="btn gold" style="width:100%;margin-top:12px">Enter beta</button></form><div id="gmsg" class="notice hidden" style="margin-top:10px"></div>`)}
function complete(k){S.done.add(k);sessionStorage.setItem('owb_done',JSON.stringify([...S.done]));api({action:'event',token:S.token,event_key:'complete_'+k,event_value:S.age})}
function reading(){api({action:'event',token:S.token,event_key:'open_reading',event_value:S.age});if(S.age==='4-6')return modal(`<h2>Read it first</h2><div class="word">sat</div><div class="sentence">Pat sat.</div><div class="notice">Text first. No picture clue yet.</div><h3>Prove it</h3><p>Ask the child to read: <b>Sam sat.</b></p><button class="btn gold" data-done="reading">We tried it</button>`);if(S.age==='7-10')return modal(`<h2>Mini reading mission</h2><div class="notice">Mia put an ice cube on two plates. One plate was in the sun and one was in the shade. She checked them five minutes later.</div><h3>Which will melt faster, and what clue helped you decide?</h3><p><b>Fresh proof:</b> warm window vs cool cupboard — what do you predict?</p><button class="btn gold" data-done="reading">We discussed it</button>`);return modal(`<h2>${S.age==='11-13'?'Antwarn Case File':'Dafari Evidence Studio'}</h2><p><b>A.</b> Everyone online says it.</p><p><b>B.</b> A current source gives a date, evidence and method.</p><p><b>C.</b> One person remembers hearing it.</p><div class="choices"><button class="choice ans">A</button><button class="choice ans" data-ok="1">B</button><button class="choice ans">C</button></div><div id="msg" class="notice">Choose the strongest claim, then explain why.</div><button class="btn gold" data-done="reading">We discussed it</button>`)}
function maths(){api({action:'event',token:S.token,event_key:'open_maths',event_value:S.age});if(S.age==='4-6')return modal(`<h2>Build 10 two ways</h2><p>Use buttons, pasta, blocks or other safe objects. Make 10 in two different ways and explain why both are still 10.</p><button class="btn gold" data-done="maths">We made it</button>`);if(S.age==='7-10')return modal(`<h2>Fraction mission</h2><p>Fold paper into 4 equal parts and shade 1.</p><div class="choices"><button class="choice ans">1/2</button><button class="choice ans" data-ok="1">1/4</button><button class="choice ans">3/4</button></div><div id="msg" class="notice">Then try 2/8. Is it the same amount?</div><button class="btn gold" data-done="maths">We tried it</button>`);return modal(`<h2>Ratio case</h2><p>A drink uses 2 cups water for every 1 cup juice. Make 3 times as much.</p><div class="choices"><button class="choice ans">4 / 2</button><button class="choice ans" data-ok="1">6 / 3</button><button class="choice ans">6 / 2</button></div><div id="msg" class="notice">Explain the scaling, not just the answer.</div><button class="btn gold" data-done="maths">We explained it</button>`)}
function move(){api({action:'event',token:S.token,event_key:'open_move',event_value:S.age});const t=S.age==='4-6'?'Find 3 safe objects. Put them shortest to tallest and explain how you decided.':S.age==='7-10'?'Find 3 safe objects. Estimate their length, then measure and compare.':S.age==='11-13'?'Choose one room. Identify 3 design choices that help or hinder its use, then propose one improvement.':'Find one non-personal claim on packaging or an advert. List what evidence would verify it.';modal(`<h2>Leave the screen for 3 minutes</h2><p>${t}</p><button class="btn gold" data-done="move">We came back & explained</button>`)}
function online(){api({action:'event',token:S.token,event_key:'open_online',event_value:S.age});const q=S.age==='4-6'?['Find <b>sat</b>','sit','sat','mat']:S.age==='7-10'?['Which equals one half?','1/3','2/4','3/4']:['Which is stronger evidence?','No source','Current evidence-backed source','Popular opinion'];modal(`<h2>Do Online</h2><p>${q[0]}</p><div class="choices"><button class="choice ans">${q[1]}</button><button class="choice ans" data-ok="1">${q[2]}</button><button class="choice ans">${q[3]}</button></div><div id="msg" class="notice">Online still ends with an off-screen proof.</div><button class="btn gold" data-done="online">Finish task</button>`)}
function ai(){modal(`<h2>AI Buddy Preview</h2><div class="notice warn"><b>Live AI is off in this beta.</b> Production AI pauses when inactive, and verified phonics sounds come from a reviewed sound bank.</div><p><b>${guide()[0]}:</b> “Show me what you can do first. If you get stuck, I’ll help. Then go away from the screen and prove it.”</p>`)}
function worlds(){modal(`<h2>Learning Worlds Preview</h2><div class="grid">${['💷 Financial Literacy','🧰 Life Skills','💡 Entrepreneurship','🤖 Coding & AI','🍳 Cooking & Nutrition','⚖️ UK Law & Rights','🗣️ Heritage Languages','🌍 World Languages & Cultures'].map(x=>`<div class="tile"><h3>${x}</h3></div>`).join('')}</div>`)}
function parent(){modal(`<h2>Parent View Preview</h2><div class="notice ok"><b>Independent:</b> completed a new example without help.</div><div class="notice" style="margin-top:8px"><b>Helped:</b> completed after a prompt.</div><div class="notice warn" style="margin-top:8px"><b>Mic unclear:</b> never counted as a child error.</div>`)}
function stars(k){return[1,2,3,4,5].map(n=>`<button type="button" data-rate="${k}" data-n="${n}" class="${S.ratings[k]===n?'on':''}">${n}</button>`).join('')}
function feedback(){modal(`<h2>Adult tester feedback</h2><p class="sub">Do not include child names or schools.</p><form id="fb"><div class="field"><label>Easy to use? 1–5</label><div class="rating">${stars('ease')}</div></div><div class="field"><label>Child engaged? 1–5</label><div class="rating">${stars('engage')}</div></div><div class="field"><label>Off-screen learning idea? 1–5</label><div class="rating">${stars('off')}</div></div><div class="field"><label>How much help?</label><select name="help"><option value="no">None</option><option value="a_little">A little</option><option value="a_lot">A lot</option><option value="not_sure">Not sure</option></select></div><div class="field"><label>Favourite area</label><select name="fav"><option>Reading</option><option>Maths</option><option>Move & Make</option><option>Do Online</option><option>AI approach</option></select></div><div class="field"><label>Comment (optional)</label><textarea name="comment" rows="4"></textarea></div><button class="btn gold" style="width:100%">Send anonymous feedback</button></form><div id="fmsg"></div>`)}
function render(){$('#app').innerHTML=S.token?home():landing();bind()}
function bind(){$$('[data-a="start"]').forEach(b=>b.onclick=gate);$$('[data-a="preview"]').forEach(b=>b.onclick=()=>alert('Tap Start family test first.'));$$('[data-a="close"]').forEach(b=>b.onclick=()=>b.closest('.modal')?.remove());$$('[data-a="exit"]').forEach(b=>b.onclick=()=>{sessionStorage.clear();location.reload()});const map={reading,maths,move,online,ai,worlds,parent,feedback};Object.entries(map).forEach(([k,v])=>$$('[data-a="'+k+'"]').forEach(b=>b.onclick=v));$$('.ans').forEach(b=>b.onclick=()=>{const m=$('#msg');if(m)m.innerHTML=b.dataset.ok?'<b>Good.</b> Now explain how you know.':'Try again and explain the relationship or evidence.'});$$('[data-done]').forEach(b=>b.onclick=()=>{complete(b.dataset.done);b.closest('.modal')?.remove();render()});$$('[data-rate]').forEach(b=>b.onclick=()=>{S.ratings[b.dataset.rate]=Number(b.dataset.n);b.parentElement.innerHTML=stars(b.dataset.rate);bind()});const g=$('#gate');if(g)g.onsubmit=async e=>{e.preventDefault();const f=new FormData(g),m=$('#gmsg');m.classList.remove('hidden');m.textContent='Checking beta access…';const x=await api({action:'start',code:String(f.get('code')).trim().toUpperCase(),age_band:f.get('age')});if(!x.ok){m.className='notice warn';m.textContent='Beta access was not accepted. Check the code and try again.';return}S.token=x.beta_token;S.age=f.get('age');sessionStorage.setItem('owb_token',S.token);sessionStorage.setItem('owb_age',S.age);document.querySelector('.modal')?.remove();render()};const fb=$('#fb');if(fb)fb.onsubmit=async e=>{e.preventDefault();const f=new FormData(fb),m=$('#fmsg');if(!S.ratings.ease||!S.ratings.engage||!S.ratings.off){m.innerHTML='<div class="notice warn">Please give all three ratings.</div>';return}const x=await api({action:'feedback',token:S.token,ease_rating:S.ratings.ease,engagement_rating:S.ratings.engage,offscreen_rating:S.ratings.off,child_needed_help:f.get('help'),favourite_area:f.get('fav'),adult_comment:f.get('comment')});m.innerHTML=x.ok?'<div class="notice ok"><b>Thank you.</b> Anonymous feedback sent.</div>':'<div class="notice warn">Could not send feedback. Please try again.</div>'}}
render();
</script>
<div class="footer">Orish's World @ THE CODE • Closed Friends & Family Beta</div>
</body>
</html>
